# nginx-hls.conf — FALLBACK PROFILE ONLY.
# Serves the relay's self-packaged HLS from /var/hls as the ORIGIN for a
# Bunny CDN pull zone. Not needed when pushing RTMP to Bunny Stream Live.
#
# Install (done by `setup-vps.sh --with-fallback`):
#   /etc/nginx/sites-available/albunyaan-hls.conf  ->  symlink into sites-enabled
#
# Topology: player -> https://<pullzone>.b-cdn.net/hls/<channel>/live.m3u8
#                      -> (cache miss) -> http://<vps>/hls/<channel>/live.m3u8
#
# Lock the origin down once the pull zone works: either firewall port 80 to
# Bunny's edge IP ranges, or set a shared-secret header on the pull zone and
# enforce it here (see the commented $http_x_pull_key check below).

# CORS: reflect only origins the player actually runs on. Served through a
# CDN, so Vary: Origin is mandatory or one origin's response gets cached for
# everyone. Add production web/app origins here as they come online.
map $http_origin $albunyaan_cors {
    default                     "";
    "https://albunyaan.tv"      $http_origin;
    "https://www.albunyaan.tv"  $http_origin;
    "https://app.albunyaan.tv"  $http_origin;
    "http://localhost:3010"     $http_origin;   # web clone dev server
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Origin for a CDN: never let clients hit it directly in production.
    # Optional shared-secret gate (configure the same header on the Bunny
    # pull zone under "Edge Rules"/origin headers), then uncomment:
    #
    # if ($http_x_pull_key != "REPLACE-WITH-LONG-RANDOM") { return 403; }

    root /var/hls;

    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
    }

    # Playlists: rewritten every ~4 s. Tiny TTL so the CDN edge re-pulls
    # fast enough for live, while still collapsing viewer stampedes.
    location ~ \.m3u8$ {
        add_header Cache-Control "public, max-age=1, s-maxage=1" always;
        add_header Access-Control-Allow-Origin $albunyaan_cors always;
        add_header Vary Origin always;
    }

    # Segments: immutable once written (relay uses temp_file for atomic
    # publish), deleted after they age out of the window. Long edge cache.
    location ~ \.ts$ {
        add_header Cache-Control "public, max-age=3600, immutable" always;
        add_header Access-Control-Allow-Origin $albunyaan_cors always;
        add_header Vary Origin always;
    }

    # Per-channel health JSON produced by relay-watchdog.service each minute.
    # The admin dashboard polls this (through the pull zone or directly).
    location = /relay-status.json {
        alias /run/albunyaan/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $albunyaan_cors always;
        add_header Vary Origin always;
    }

    location = / {
        return 404;
    }
}
